# Anomaly-Based Network Intrusion Detection System Configuration

# Dataset Configuration
datasets:
  unsw_nb15:
    path: "data/UNSW-NB15.csv"
    description: "UNSW-NB15 Network Intrusion Detection Dataset"
    train_split: 0.7
    test_split: 0.15
    val_split: 0.15
    random_state: 42
    
  nsl_kdd:
    path: "data/NSL-KDD.csv"
    description: "NSL-KDD Network Intrusion Detection Dataset"
    train_split: 0.7
    test_split: 0.15
    val_split: 0.15
    random_state: 42

# Preprocessing Configuration
preprocessing:
  missing_values:
    strategy: "median"  # median, mean, most_frequent
    fill_value: 0
    
  scaling:
    method: "standard"  # standard, minmax, robust
    with_mean: true
    with_std: true
    
  categorical_encoding:
    method: "onehot"  # onehot, ordinal, target
    handle_unknown: "ignore"

# Feature Engineering Configuration
features:
  statistical_features: true
  temporal_features: true
  network_features: true
  interaction_features: false
  polynomial_features: false
  
  feature_selection:
    method: "mutual_info"  # mutual_info, chi2, f_classif
    k_features: 30

# Model Configuration
models:
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42
    n_jobs: -1
    
  logistic_regression:
    C: 1.0
    penalty: "l2"
    solver: "lbfgs"
    max_iter: 1000
    random_state: 42
    
  lstm:
    units: [128, 64]
    dropout: 0.2
    recurrent_dropout: 0.2
    activation: "relu"
    output_activation: "sigmoid"
    optimizer: "adam"
    loss: "binary_crossentropy"
    metrics: ["accuracy"]
    epochs: 50
    batch_size: 64
    validation_split: 0.1
    early_stopping_patience: 10
    
  autoencoder:
    encoding_dim: 32
    hidden_dims: [64, 32]
    activation: "relu"
    output_activation: "sigmoid"
    optimizer: "adam"
    loss: "mse"
    epochs: 100
    batch_size: 256
    validation_split: 0.1

# Training Configuration
training:
  cross_validation:
    n_splits: 5
    shuffle: true
    random_state: 42
    
  hyperparameter_tuning:
    method: "grid"  # grid, random, bayesian
    n_iter: 20
    cv: 3
    
  class_weight:
    method: "balanced"  # balanced, custom, none

# Evaluation Configuration
evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
    - "pr_auc"
    
  thresholds:
    default: 0.5
    optimize_for: "f1"
    
  visualization:
    confusion_matrix: true
    roc_curve: true
    precision_recall_curve: true
    feature_importance: true
    learning_curves: true

# Output Configuration
output:
  models_dir: "models/"
  results_dir: "final_reports/"
  logs_dir: "logs/"
  
  save_format:
    models: "joblib"  # joblib, pickle, h5
    results: "csv"
    figures: "png"
    
  compression:
    enabled: true
    level: 6

# System Configuration
system:
  parallel_processing: true
  n_jobs: -1
  memory_limit: "4GB"
  gpu_acceleration: false
  
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: "logs/project.log"